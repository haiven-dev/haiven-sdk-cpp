name: Shadow build tests

on:
  pull_request:
    paths:
      - .github/shadow-build/**
      - .github/workflows/shadow-build*.yml
  push:
    branches: [main]
    paths:
      - .github/shadow-build/**
      - .github/workflows/shadow-build*.yml

permissions:
  contents: read

jobs:
  test:
    name: Shadow build tests / ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14'
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: '1.27.1'
          cache: false
      - name: Install pinned encryption test tooling
        shell: bash
        run: |
          go install filippo.io/age/cmd/age@v1.3.2
          go install filippo.io/age/cmd/age-keygen@v1.3.2
          go_bin="$(go env GOPATH)/bin"
          printf '%s\n' "$go_bin" >> "$GITHUB_PATH"
      - name: Test request validation and the encryption contract
        run: python .github/shadow-build/test_build.py -v
